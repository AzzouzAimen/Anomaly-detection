name: apnea-detection

services:
  postgres:
    image: postgres:17-alpine
    container_name: apnea_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:password}
      POSTGRES_DB: ${POSTGRES_DB:-apnea_db}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:user} -d ${POSTGRES_DB:-apnea_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: